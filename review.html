<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Lascia una recensione</title>
<meta name="theme-color" content="#101C24">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Alfa+Slab+One&family=Karla:wght@400;500;700&display=swap" rel="stylesheet">

<style>
  :root{
    --ink:#101C24;
    --paper:#FAF7F1;
    --brass:#C29B4C;
  }
  *{box-sizing:border-box}
  body{
    margin:0; min-height:100vh;
    background:linear-gradient(135deg, var(--ink) 0%, #1B2C38 100%);
    display:flex; justify-content:center; align-items:center;
    padding:20px;
    font-family:Karla,"Helvetica Neue",Arial,sans-serif;
  }

  .container{
    text-align:center;
    color:var(--paper);
    max-width:320px;
  }

  .checkmark{
    width:64px; height:64px;
    margin:0 auto 20px;
    background:rgba(194,155,76,.15);
    border-radius:50%;
    display:grid; place-items:center;
    font-size:32px;
    animation:pop .6s cubic-bezier(.2,.9,.3,1.4) both;
  }

  h1{
    font-family:"Alfa Slab One",Georgia,serif;
    font-size:26px;
    margin:0 0 8px;
    font-weight:400;
  }

  p{
    margin:0 0 12px;
    font-size:15px;
    color:rgba(250,247,241,.8);
    line-height:1.5;
  }

  .action{
    margin-top:24px;
    font-size:13.5px;
    color:rgba(250,247,241,.7);
  }

  @keyframes pop{from{opacity:0; transform:scale(.7)} to{opacity:1; transform:none}}
  @media (prefers-reduced-motion:reduce){.checkmark{animation:none}}
</style>
</head>
<body>
<div class="container">
  <div class="checkmark">✓</div>
  <h1>Testo copiato!</h1>
  <p>Il testo della recensione è negli appunti.</p>
  <p>Si apre il modulo di Google — incolla e invia con le tue stelle.</p>
  <div class="action">Se non si apre, <a href="https://search.google.com/local/writereview?placeid=ChIJNxE3HIrdOxMR6-SMs_lDljQ" style="color:var(--brass); text-decoration:none">clicca qui</a>.</div>
</div>

<textarea id="temp" style="display:none"></textarea>

<script>
const reviewText = "Perfetto per il taglio e la barba. Alessandro sa il fatto suo e mi ha ascoltato. Tempi di attesa ragionevoli e ambiente accogliente. Tornerò.";
const textarea = document.getElementById('temp');

// Metodo 1: clipboard API moderna
if (navigator.clipboard && navigator.clipboard.writeText) {
  navigator.clipboard.writeText(reviewText).then(() => {
    setTimeout(() => {
      window.location.href = "https://search.google.com/local/writereview?placeid=ChIJNxE3HIrdOxMR6-SMs_lDljQ";
    }, 1500);
  });
} else {
  // Metodo 2: fallback su document.execCommand (più vecchio ma compatibile)
  textarea.value = reviewText;
  textarea.select();
  document.execCommand('copy');
  setTimeout(() => {
    window.location.href = "https://search.google.com/local/writereview?placeid=ChIJNxE3HIrdOxMR6-SMs_lDljQ";
  }, 1500);
}
</script>
</body>
</html>
